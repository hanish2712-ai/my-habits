<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Engine Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .day-checkbox:checked + div {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-20">
        
        <div class="sticky top-0 bg-white z-10 px-6 py-4 border-b border-gray-100">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-gray-900">Habit Engine</h1>
                    <p id="currentDate" class="text-sm text-gray-500 font-medium"></p>
                </div>
                <div id="todayScoreBadge" class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold">
                    0%
                </div>
            </div>

            <div id="statsSection" class="grid grid-cols-2 gap-3 mb-2">
                <div class="bg-orange-50 p-3 rounded-xl border border-orange-100">
                    <div class="text-[10px] uppercase text-orange-600 font-bold tracking-wider mb-1">🔥 >90% Streak</div>
                    <div class="text-2xl font-black text-orange-800" id="streak90">0</div>
                    <div class="text-xs text-orange-400">Days</div>
                </div>
                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                    <div class="text-[10px] uppercase text-blue-600 font-bold tracking-wider mb-1">💎 Perfect Streak</div>
                    <div class="text-2xl font-black text-blue-800" id="streak100">0</div>
                    <div class="text-xs text-blue-400">Days</div>
                </div>
            </div>
        </div>

        <div class="p-6">
            
            <div id="view-tracker">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700">Today's Tasks</h2>
                    <span id="taskCount" class="text-xs bg-gray-200 px-2 py-1 rounded text-gray-600">0/0</span>
                </div>

                <div id="emptyState" class="hidden text-center py-10">
                    <p class="text-gray-400 mb-2">No habits scheduled for today!</p>
                    <button onclick="switchView('config')" class="text-blue-500 text-sm font-semibold hover:underline">Configure Habits</button>
                </div>

                <ul id="todayList" class="space-y-3 mb-8">
                    </ul>

                <div class="mt-8 border-t pt-6">
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-4">Last 7 Days Performance</h3>
                    <div class="flex justify-between items-end h-24 gap-2" id="weeklyChart">
                        </div>
                </div>
            </div>

            <div id="view-config" class="hidden">
                <h2 class="text-lg font-bold text-gray-700 mb-4">Manage Habits</h2>
                
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6">
                    <input type="text" id="newHabitName" placeholder="Enter habit name (e.g., Read 10 pages)" 
                           class="w-full p-3 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
                    
                    <p class="text-xs font-bold text-gray-500 uppercase mb-2">Repeat On</p>
                    <div class="flex justify-between mb-4">
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="1" checked>
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">M</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="2" checked>
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">T</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="3" checked>
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">W</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="4" checked>
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">T</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="5" checked>
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">F</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="6">
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">S</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" class="day-checkbox hidden" value="0">
                            <div class="w-8 h-8 flex items-center justify-center rounded-full border bg-white text-xs font-bold text-gray-400 select-none">S</div>
                        </label>
                    </div>

                    <button onclick="addNewHabit()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-blue-700 transition">
                        Add Habit
                    </button>
                </div>

                <h3 class="text-sm font-bold text-gray-500 uppercase mb-3">Your Habits</h3>
                <ul id="configList" class="space-y-2"></ul>
            </div>

        </div>

        <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-2 flex justify-around items-center z-20 pb-4">
            <button onclick="switchView('tracker')" id="btn-tracker" class="flex flex-col items-center p-2 text-blue-600">
                <span class="text-2xl">⚡</span>
                <span class="text-[10px] font-bold mt-1">Today</span>
            </button>
            <button onclick="switchView('config')" id="btn-config" class="flex flex-col items-center p-2 text-gray-400">
                <span class="text-2xl">⚙️</span>
                <span class="text-[10px] font-bold mt-1">Config</span>
            </button>
        </div>

    </div>

    <script>
        // --- DATA MANAGEMENT ---
        // Habits structure: { id: 123, name: "Run", days: [1,3,5] }
        // History structure: { "2023-10-27": { score: 100, completedIds: [123] } }
        
        let habits = JSON.parse(localStorage.getItem('proHabits')) || [];
        let history = JSON.parse(localStorage.getItem('proHistory')) || {};
        
        const daysMap = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const todayKey = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
        const currentDayIndex = new Date().getDay(); // 0-6

        // Initialize today's history if not exists
        if (!history[todayKey]) {
            history[todayKey] = { score: 0, completedIds: [] };
        }

        // --- CORE FUNCTIONS ---

        function save() {
            localStorage.setItem('proHabits', JSON.stringify(habits));
            localStorage.setItem('proHistory', JSON.stringify(history));
            render();
        }

        function switchView(viewName) {
            document.getElementById('view-tracker').classList.add('hidden');
            document.getElementById('view-config').classList.add('hidden');
            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            // Update bottom nav styles
            const tBtn = document.getElementById('btn-tracker');
            const cBtn = document.getElementById('btn-config');
            if(viewName === 'tracker') {
                tBtn.className = "flex flex-col items-center p-2 text-blue-600";
                cBtn.className = "flex flex-col items-center p-2 text-gray-400";
            } else {
                tBtn.className = "flex flex-col items-center p-2 text-gray-400";
                cBtn.className = "flex flex-col items-center p-2 text-blue-600";
            }
            render();
        }

        function addNewHabit() {
            const name = document.getElementById('newHabitName').value;
            if(!name) return alert("Please enter a name");

            const selectedDays = [];
            document.querySelectorAll('.day-checkbox:checked').forEach(cb => {
                selectedDays.push(parseInt(cb.value));
            });

            if(selectedDays.length === 0) return alert("Select at least one day");

            habits.push({
                id: Date.now(),
                name: name,
                days: selectedDays
            });

            document.getElementById('newHabitName').value = '';
            alert('Habit Added!');
            save();
        }

        function deleteHabit(id) {
            if(confirm("Delete this habit?")) {
                habits = habits.filter(h => h.id !== id);
                save();
            }
        }

        function toggleTask(id) {
            const completed = history[todayKey].completedIds;
            if (completed.includes(id)) {
                history[todayKey].completedIds = completed.filter(i => i !== id);
            } else {
                history[todayKey].completedIds.push(id);
            }
            save(); // Render calls calculateScore
        }

        function calculateStreaks() {
            // Sort dates keys
            const sortedDates = Object.keys(history).sort((a,b) => new Date(b) - new Date(a));
            // Exclude today for streak calculation unless we want 'live' streaks. 
            // Usually streaks are calculated up to yesterday + today if goal met.
            
            let streak90 = 0;
            let streak100 = 0;
            
            // We check backwards from TODAY
            // If today is < goal, we don't count it yet, but we don't break streak unless yesterday failed.
            // Simplified: Look at last 365 days.
            
            let d = new Date();
            let keepGoing90 = true;
            let keepGoing100 = true;
            
            // Check today first
            const todayData = history[todayKey];
            const todayHabits = habits.filter(h => h.days.includes(currentDayIndex));
            
            // If today has tasks and we met goal, count it. If not, don't count but don't break yet.
            // Actually, simpler logic: Count backwards day by day.
            
            for (let i = 0; i < 365; i++) {
                const dateStr = d.toISOString().split('T')[0];
                const dayIdx = d.getDay();
                
                // Get history for that day
                const dayData = history[dateStr];
                
                // Find habits that were active on THAT day of week
                // (Note: This is a simplification. Ideally we'd store historical habit snapshots, 
                // but for this app we assume habits schedule didn't change drastically)
                const relevantHabits = habits.filter(h => h.days.includes(dayIdx));
                
                if (relevantHabits.length === 0) {
                    // Rest day? Skip back one day, don't break streak, don't add to streak.
                    d.setDate(d.getDate() - 1);
                    continue; 
                }

                let score = 0;
                if (dayData) {
                    // Re-calculate score based on CURRENT habit definitions (limitation of simple apps)
                    // or use stored score if we trust it. Let's use stored score if available.
                     score = dayData.score;
                }

                if (i === 0) { // Today
                    // If today is not done, ignore it (streak = streak from yesterday)
                    if (score >= 90) streak90++; else keepGoing90 = false; // logic adjust: usually don't break on today
                    if (score == 100) streak100++; else keepGoing100 = false;
                } else {
                    // Past days
                    if (keepGoing90) {
                        if (score >= 90) streak90++; else keepGoing90 = false;
                    }
                    if (keepGoing100) {
                        if (score == 100) streak100++; else keepGoing100 = false;
                    }
                }
                
                if (!keepGoing90 && !keepGoing100) break;
                d.setDate(d.getDate() - 1);
            }
            
            document.getElementById('streak90').innerText = streak90;
            document.getElementById('streak100').innerText = streak100;
        }

        function render() {
            // 1. Set Date
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

            // 2. Identify Today's Habits
            const todaysHabits = habits.filter(h => h.days.includes(currentDayIndex));
            
            // 3. Render Tracker List
            const listEl = document.getElementById('todayList');
            const emptyEl = document.getElementById('emptyState');
            listEl.innerHTML = '';
            
            let completedCount = 0;

            if (todaysHabits.length === 0) {
                emptyEl.classList.remove('hidden');
            } else {
                emptyEl.classList.add('hidden');
                todaysHabits.forEach(h => {
                    const isDone = history[todayKey].completedIds.includes(h.id);
                    if(isDone) completedCount++;
                    
                    const li = document.createElement('li');
                    li.className = `flex items-center justify-between p-4 rounded-xl border transition-all ${isDone ? 'bg-blue-50 border-blue-200' : 'bg-white border-gray-100 shadow-sm'}`;
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div onclick="toggleTask(${h.id})" class="cursor-pointer w-6 h-6 rounded-full border-2 flex items-center justify-center ${isDone ? 'bg-blue-500 border-blue-500' : 'border-gray-300'}">
                                ${isDone ? '<span class="text-white text-xs">✓</span>' : ''}
                            </div>
                            <span class="${isDone ? 'text-gray-400 line-through' : 'text-gray-800 font-medium'}">${h.name}</span>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            }

            // 4. Update Score & Header
            const total = todaysHabits.length;
            const score = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            
            // Update history score for today
            history[todayKey].score = score;
            localStorage.setItem('proHistory', JSON.stringify(history)); // Quick save of score

            document.getElementById('taskCount').innerText = `${completedCount}/${total}`;
            document.getElementById('todayScoreBadge').innerText = `${score}%`;
            
            // Color code the badge
            const badge = document.getElementById('todayScoreBadge');
            if(score === 100) badge.className = "bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold";
            else if (score >= 50) badge.className = "bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold";
            else badge.className = "bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold";

            // 5. Render Configuration List
            const configList = document.getElementById('configList');
            configList.innerHTML = '';
            habits.forEach(h => {
                const dayString = h.days.map(d => daysMap[d].substring(0,1)).join(', ');
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-3 bg-white border border-gray-100 rounded-lg";
                li.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800">${h.name}</div>
                        <div class="text-xs text-gray-400">Repeats: ${dayString}</div>
                    </div>
                    <button onclick="deleteHabit(${h.id})" class="text-red-400 text-xs px-2 py-1 bg-red-50 rounded">Delete</button>
                `;
                configList.appendChild(li);
            });

            // 6. Render Weekly Chart
            renderWeeklyChart();
            
            // 7. Calculate Streaks
            calculateStreaks();
        }

        function renderWeeklyChart() {
            const chart = document.getElementById('weeklyChart');
            chart.innerHTML = '';
            
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dStr = d.toISOString().split('T')[0];
                const dayName = daysMap[d.getDay()].substring(0,1);
                
                const score = (history[dStr] && history[dStr].score) || 0;
                
                // Color bar based on score
                let colorClass = "bg-gray-200";
                if(score >= 90) colorClass = "bg-green-400";
                else if(score >= 50) colorClass = "bg-blue-400";

                chart.innerHTML += `
                    <div class="flex-1 flex flex-col items-center gap-1 group">
                        <div class="relative w-full bg-gray-100 rounded-t-sm h-full flex flex-col justify-end overflow-hidden">
                            <div class="${colorClass} w-full transition-all duration-500" style="height: ${score}%"></div>
                        </div>
                        <span class="text-[10px] text-gray-400 font-bold">${dayName}</span>
                    </div>
                `;
            }
        }

        // Init
        render();

    </script>
</body>
</html>
